spring.application.name=railtrack-backend
server.port=${PORT:8080}
railtrack.cors.allowed-origins=${RAILTRACK_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://balajidub.github.io}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/railtrack?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
